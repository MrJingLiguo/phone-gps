name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # 仓库只保留 Dart 代码，android/ 平台文件由 flutter create 生成
      - name: Generate android platform files
        run: flutter create . --platforms android --project-name fieldmap --org com.jing

      # 固定签名：有 KEYSTORE_B64 secret 就用（保证覆盖安装/应用内更新可用），没有则退回 debug 签名
      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.p12
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=fieldmap" >> "$GITHUB_ENV"
            echo "signed with release keystore"
          else
            echo "no KEYSTORE_B64 secret, fallback to debug signing"
          fi

      - name: Configure Android (label / minSdk / permissions)
        run: |
          python3 - <<'EOF'
          import pathlib

          # 1) AndroidManifest.xml: 注入权限 + 中文应用名
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          )
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("    <application", perms + "\n\n    <application", 1)
          # Android 11+ 包可见性：声明可查询的地图 scheme，否则 canLaunch/launch 误报
          if "<queries>" not in s:
              queries = (
                  '    <queries>\n'
                  '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="amapuri"/></intent>\n'
                  '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="androidamap"/></intent>\n'
                  '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="geo"/></intent>\n'
                  '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
                  '    </queries>\n'
              )
              s = s.replace("    <application", queries + "\n    <application", 1)
          # 应用内更新安装 APK 需要此权限声明
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace(
                  "    <application",
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application',
                  1,
              )
          # flutter_downloader 后台下载需要 FileProvider 声明（插件自带 provider_paths 资源）
          if "DownloadedFileProvider" not in s:
              provider = (
                  '        <provider\n'
                  '            android:name="vn.hunghd.flutterdownloader.DownloadedFileProvider"\n'
                  '            android:authorities="${applicationId}.flutter_downloader.provider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true" >\n'
                  '            <meta-data\n'
                  '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '                android:resource="@xml/provider_paths"/>\n'
                  '        </provider>\n'
              )
              s = s.replace("    </application>", provider + "    </application>", 1)
          s = s.replace('android:label="fieldmap"', 'android:label="地块管家"')
          p.write_text(s, encoding="utf-8")
          print("manifest ok")

          # 2) minSdk 提升到 23（geolocator 要求），兼容 groovy/kts 两种模板
          for f in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              pp = pathlib.Path(f)
              if not pp.exists():
                  continue
              t = pp.read_text(encoding="utf-8")
              import re
              t = re.sub(r"minSdk\s*=\s*(flutter\.minSdkVersion|\d+)", "minSdk = 23", t)
              t = re.sub(r"minSdkVersion\s+(flutter\.minSdkVersion|\d+)", "minSdkVersion 23", t)
              # 固定签名（keystore.p12 由上一步解码到 android/app/）
              if pathlib.Path("android/app/keystore.p12").exists():
                  sig = (
                      'signingConfig = signingConfigs.create("ci") {\n'
                      '                storeType = "PKCS12"\n'
                      '                storeFile = file("keystore.p12")\n'
                      '                storePassword = System.getenv("KS_PASS")\n'
                      '                keyAlias = System.getenv("KS_ALIAS")\n'
                      '                keyPassword = System.getenv("KS_PASS")\n'
                      '            }'
                  )
                  t = t.replace(
                      'signingConfig = signingConfigs.getByName("debug")', sig)
                  print("release signing patched")
              pp.write_text(t, encoding="utf-8")
              print(f, "ok")
          EOF

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Extract version
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk 地块管家.apk
          cp build/app/outputs/flutter-apk/app-release.apk "fieldmap-v${{ steps.ver.outputs.v }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 地块管家-apk
          path: 地块管家.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 地块管家 v${{ steps.ver.outputs.v }}
          body: "自动构建发布。同签名 APK 可直接覆盖安装。"
          files: fieldmap-v${{ steps.ver.outputs.v }}.apk
          overwrite: true
