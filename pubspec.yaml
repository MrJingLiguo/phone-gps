name: fieldmap
description: 地块管家 - GPS 轨迹记录、地块采集与拍照管理
publish_to: "none"
version: 1.5.0+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  provider: ^6.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  archive: ^3.6.1
  file_picker: ^10.0.0
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0
  flutter_downloader: ^1.11.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
